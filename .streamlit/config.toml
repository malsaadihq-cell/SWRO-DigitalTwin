[theme]

base = "light"
primaryColor = "#285A7A"             # deep steel blue — accent
backgroundColor = "#F1EEE6"          # warm paper — page background
secondaryBackgroundColor = "#E5E1D6" # sand — sidebar / cards
textColor = "#201E1A"                # warm near-black — body text
font = "sans serif"

[server]
runOnSave = true
